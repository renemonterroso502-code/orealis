<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Checkout - Oréalis
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


</head>


<body>


<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="../index.html">

💎 Oréalis

</a>

</div>

</nav>




<div class="container mt-5">


<h2>

Finalizar compra

</h2>



<form id="formCompra" class="card p-4 shadow">


<div class="mb-3">

<label>
Nombre
</label>

<input 
id="nombre"
class="form-control"
required>

</div>



<div class="mb-3">

<label>
Teléfono
</label>

<input 
id="telefono"
class="form-control"
required>

</div>




<div class="mb-3">

<label>
Dirección / Lugar de entrega
</label>

<textarea
id="direccion"
class="form-control"
required></textarea>

</div>



<div class="mb-3">

<label>
Notas / Personalización (texto a grabar, colores, tamaño, referencia de diseño)
</label>

<textarea
id="notas"
class="form-control"
placeholder="Ej: nombre 'Ana', letras en acrílico dorado, 20cm de ancho..."></textarea>

</div>



<h4>

Total:

Q<span id="totalCompra">
0
</span>

</h4>




<button 
class="btn btn-success btn-lg">

Confirmar pedido

</button>


</form>



</div>




<script type="module" src="../js/checkout.js"></script>


</body>

</html>
