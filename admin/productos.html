<!-- CONTENIDO -->

<div class="content">



<nav class="navbar bg-white shadow-sm">


<div class="container-fluid">


<h4>

Gestión de Productos

</h4>


</div>


</nav>





<div class="container-fluid mt-4">


<div class="row g-4">





<!-- FORMULARIO -->


<div class="col-lg-4">


<div class="card shadow">


<div class="card-body">


<h4>

<i class="fa-solid fa-plus"></i>

Nuevo Producto

</h4>



<form id="productoForm">





<label class="mt-3">

Imagen

</label>


<input 
type="file"
class="form-control"
id="imagen"
accept="image/*">



<img 
id="vistaImagen"
style="
width:100%;
margin-top:15px;
border-radius:10px;
display:none;
">







<label class="mt-3">

Nombre

</label>


<input
type="text"
class="form-control"
id="nombre"
placeholder="Ejemplo: Letrero MDF personalizado"
required>






<label class="mt-3">

Categoría

</label>


<select
class="form-select"
id="categoria">


<option>
MDF Corte Láser
</option>


<option>
Acrílico Láser
</option>


<option>
Impresión 3D
</option>


<option>
Sublimado
</option>


<option>
Otras Decoraciones
</option>


</select>







<label class="mt-3">

Precio

</label>


<input
type="number"
class="form-control"
id="precio"
placeholder="Precio Q"
required>








<label class="mt-3">

Inventario

</label>


<input
type="number"
class="form-control"
id="stock"
placeholder="Cantidad"
required>







<label class="mt-3">

Descripción

</label>


<textarea

class="form-control"

id="descripcion"

rows="4"

placeholder="Descripción del producto">

</textarea>








<button
type="submit"
class="btn btn-success w-100 mt-4">


<i class="fa-solid fa-save"></i>


Guardar Producto


</button>





</form>



</div>


</div>


</div>








<!-- TABLA PRODUCTOS -->



<div class="col-lg-8">



<div class="card shadow">


<div class="card-body">



<h4>

Productos Registrados

</h4>





<input 

type="text"

id="buscarProducto"

class="form-control mb-3"

placeholder="Buscar producto...">







<div class="table-responsive">



<table class="table table-hover">



<thead>


<tr>


<th>
Imagen
</th>


<th>
Producto
</th>


<th>
Precio
</th>


<th>
Stock
</th>


<th>
Acciones
</th>


</tr>



</thead>






<tbody id="listaProductos">



</tbody>





</table>



</div>





</div>


</div>




</div>





</div>


</div>


</div>
